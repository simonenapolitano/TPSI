<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="container">
        <div class="container1">
            <h1>Verifica di Matematica</h1>
            <p>Rispondi alle domande e poi premi "Correggi Verifica".</p>
            <div>
                <div class="quesito">
                    <p>Quanto fa <b>125*8</b>?</p>
                    <label>
                        <input type="radio" name="quesito1" value="800">800
                    </label><br>
                    <label>
                        <input type="radio" name="quesito1" value="1000">1000
                    </label><br>
                    <label>
                        <input type="radio" name="quesito1" value="1250">1250
                    </label><br>
                    <label>
                        <input type="radio" name="quesito1" value="950">950
                    </label>
                </div><br>
                <div class="quesito">
                    <p>Quanto fa <b>144/12</b>?</p>
                    <label>
                        <input type="radio" name="quesito2" value="10">10
                    </label><br>
                    <label>
                        <input type="radio" name="quesito2" value="14">14
                    </label><br>
                    <label>
                        <input type="radio" name="quesito2" value="12">12
                    </label><br>
                    <label>
                        <input type="radio" name="quesito2" value="11">11
                    </label>
                </div> <br>
                <button id="correggiVerificaBtn" onclick="correggiQuiz()">CORREGGI VERIFICA</button>
                <p id="feedbackVisivo"></p>
            </div>
        </div>
        <div>
            <div class="login">
                <h2>Login</h2>
                <label>
                    Utente: <br>
                    <input type="text" id="studenteInput" placeholder="es. studente"><br>
                </label><br>
                <label>
                    Password: <br>
                    <input type="text" id="passwordInput" placeholder="es. 1234"><br>
                </label><br>
                <button id="accediBtn" onclick="login()">Accedi</button>
            </div> <br>
            <div class="calcolatrice">
                <h2>Calcolatrice</h2>
                <input type="text" id="numero1" placeholder="Numero 1"><br><br>
                <select id="sceltaOperazione">
                    <option value="+">Somma (+)</option>
                    <option value="-">Sottrazione (-)</option>
                    <option value="*">Moltiplicazione (X)</option>
                    <option value="/">Divisione (/)</option>
                </select><br><br>
                <input type="text" id="numero2" placeholder="Numero 2"><br><br>
                <button id="calcolaBtn" onclick="calcolatrice()">Calcola</button>
                <label>
                    Risultato: <br>
                    <input type="text" id="risultatoCalc"><br>
                </label><br>
            </div><br>
            <div class="consegna">
                <h2>Consegna</h2>
                <label>
                    Note per il prof: <br>
                    <textarea placeholder="Note..." ></textarea>
                </label>
                <form>
                    <input type="checkbox" name="checkBox">Ho controllato tutto
                </form> <br>
                <button id="terminaCompitoBtn" onclick="consegna()">TERMINA COMPITO</button>
            </div>
        </div>
        
    </div>
    <script src="src/js/script.js"></script>
</body>
</html>
